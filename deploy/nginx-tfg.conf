# Bloque 443 de /etc/nginx/sites-enabled/default.
#
# nginx deja de ser servidor web y queda solo como reverse proxy: el frontend se
# sirve desde Cloudflare. Lo que sigue viviendo aca es lo que tiene estado.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name air-quality-campus-una.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/air-quality-campus-una.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/air-quality-campus-una.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Se conserva el root SOLO por el challenge de ACME (ver abajo).
    root /var/www/html;

    # IMPORTANTE: esta location tiene que ir ANTES del redirect general.
    # El bloque 80 manda todo a 443, asi que Certbot valida por HTTPS; sin esta
    # excepcion el challenge se iria redirigido a Cloudflare y las renovaciones
    # empezarian a fallar en silencio hasta que venza el certificado — y con el
    # se caeria tambien el MQTTS del gateway, que usa el mismo cert.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # API REST. Gana sobre 'location /' por prefijo mas largo.
    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MQTT sobre WebSocket seguro, para el dashboard.
    location /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        # Las conexiones MQTT son largas y silenciosas entre mensajes: sin esto
        # nginx las corta a los 60 s y el dashboard reconecta cada minuto.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # Todo lo demas vive ahora en Cloudflare.
    location / {
        return 301 https://tfg-iek-ti-2026.alvaro-aguinagalde13.workers.dev$request_uri;
    }
}

# --- Recordatorio, NO va en este archivo ---
# El bloque 'stream' del MQTTS del gateway (listen 8883 -> 127.0.0.1:1883) vive
# en /etc/nginx/nginx.conf, fuera de http{}. No se toca: el gateway LoRa depende
# de el y usa el mismo certificado de Let's Encrypt.
