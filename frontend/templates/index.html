<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Monitoreo de Calidad del Aire</title>
    
    <link rel="stylesheet" href="/styles/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/3.4.4/luxon.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-adapter-luxon/1.3.1/chartjs-adapter-luxon.umd.min.js"></script>

    <script src="/scripts/main.js" type="module" defer></script>
    <script src="/scripts/chart-logic.js" type="module" defer></script>
    <script src="/scripts/config.js" type="module" defer></script>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-container">
                <img src="/images/fpuna_logo_institucional.svg" alt="Logo FPUNA" class="logo-fpuna">
                <h1 class="title-main">Monitoreo de Calidad del Aire en el CAMPUS UNA-SLO</h1>
                <img src="/images/gisd-1.png" alt="Logo GISD" class="logo-gisd">
            </div>
        </header>

        <section class="station-section" id="station-1">
            <h2 class="station-title">Estación 1</h2>
            <div class="chart-grid">
                <div class="chart-card">
                    <h4>PM2.5</h4>
                    <canvas id="chart_estacion_01_pm25"></canvas>
                </div>
                <div class="chart-card">
                    <h4>PM10</h4>
                    <canvas id="chart_estacion_01_pm10"></canvas>
                </div>
                <div class="chart-card">
                    <h4>Temperatura</h4>
                    <canvas id="chart_estacion_01_temperatura"></canvas>
                </div>
                <div class="chart-card">
                    <h4>Humedad</h4>
                    <canvas id="chart_estacion_01_humedad"></canvas>
                </div>
            </div>
        </section>

        <section class="station-section" id="station-2">
            <h2 class="station-title">Estación 2</h2>
            <div class="chart-grid">
                <div class="chart-card">
                    <h4>PM2.5</h4>
                    <canvas id="chart_estacion_02_pm25"></canvas>
                </div>
                <div class="chart-card">
                    <h4>PM10</h4>
                    <canvas id="chart_estacion_02_pm10"></canvas>
                </div>
                <div class="chart-card">
                    <h4>Temperatura</h4>
                    <canvas id="chart_estacion_02_temperatura"></canvas>
                </div>
                <div class="chart-card">
                    <h4>Humedad</h4>
                    <canvas id="chart_estacion_02_humedad"></canvas>
                </div>
            </div>
        </section>
    </div>

    <!-- MODAL MOVIDO FUERA DEL CONTAINER - ESTO ES CRÍTICO -->
    <div id="modal-historial-container" class="modal-container-oculto">
        <div class="modal-contenido">
            <span id="modal-cerrar" class="modal-cerrar-btn">&times;</span>
            <h2 id="modal-titulo">Historial de...</h2>
            
            <div class="modal-controles">
                <button class="rango-btn activo" data-rango="24h">Últimas 24h</button>
                <button class="rango-btn" data-rango="7d">Últimos 7 días</button>
                <button class="rango-btn" data-rango="30d">Último Mes</button>
            </div>
            <div class="modal-controles-custom">
                <label>Inicio:</label>
                <input type="date" id="fecha-inicio">
                <label>Fin:</label>
                <input type="date" id="fecha-fin">
                <button id="btn-custom-rango">Aplicar</button>
            </div>
            <div class="modal-chart-container">
                <canvas id="chart-historial"></canvas>
            </div>
        </div>
    </div>
</body>
</html>
